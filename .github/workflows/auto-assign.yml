# Assign every new issue to the repository owner.
name: Auto assign issues
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - run: gh issue edit "$NUMBER" --add-assignee "$OWNER" --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
